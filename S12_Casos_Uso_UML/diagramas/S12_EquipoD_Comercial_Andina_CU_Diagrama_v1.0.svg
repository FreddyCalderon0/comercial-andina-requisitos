<rect x="30" y="800" width="1340" height="112" rx="6" fill="#F3F6FA" stroke="#9AA9BD"/>
<text x="46" y="826" font-size="15" font-weight="bold" fill="#1F3864">Decisiones que permanecen fuera del SoI (RS-CA-01, D-S12-01)</text>
<text x="46" y="848" font-size="14" fill="#222">Almacén certifica el stock físico y autoriza el picking · Créditos decide el crédito (CR-01) · Ventas confirma versión y compromiso ·</text>
<text x="46" y="868" font-size="14" fill="#222">Despacho cierra, replanifica y decide la salida. Ventas y TI son interesados, no actores de estos CU. Asociaciones simples: sin «include» ni «extend».</text>
